<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick Detail — OmniSight</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ticker-tape" class="ticker-tape"></div>
  <div id="picks-tape" class="ticker-tape picks-tape"></div>
  <header class="nav">
    <div class="nav-brand">OmniSight</div>
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="picks.html">Picks</a>
      <a href="alerts.html">Alerts</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="govgistics.html">Contract Intel</a>
      <a href="hub.html">Hub</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="section">
    <p><a href="picks.html" class="asset-link">← Back to Picks</a></p>
    <p class="live-stamp" id="data-stamp"></p>
    <div id="pick-detail"><p class="live-stamp">Loading pick detail…</p></div>
  </main>

  <script src="nav.js"></script>
  <script src="link-guard.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="data-stamp.js"></script>
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(window.location.search);
    var asset = (params.get('asset') || '').toUpperCase();
    var type = params.get('type') || 'swing'; // swing | intraday
    var side = params.get('side') || 'long';
    // Market qualifier: CVX is two assets (crypto Convex Finance, stock
    // Chevron) that share one symbol. ?market=crypto or &market=stock
    // picks one; with no market the page disambiguates instead of
    // silently showing whichever the engine listed first.
    var marketParam = (params.get('market') || '').toLowerCase();
    if (marketParam === 'equity') marketParam = 'stock';
    if (marketParam !== 'crypto' && marketParam !== 'stock') marketParam = '';

    // Which market a pick belongs to, from the engine's own class field.
    function marketOf(p) {
      var cls = (p['class'] || '').toLowerCase();
      if (cls === 'crypto') return 'crypto';
      if (cls === 'equity') return 'stock';
      if (p.info_url && p.info_url.indexOf('coingecko') > -1) return 'crypto';
      if (p.cik) return 'stock';
      return '';
    }
    function marketLabel(m) { return m === 'crypto' ? 'Crypto' : (m === 'stock' ? 'Stock' : ''); }

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    // Engine clock strings arrive as "HH:MM UTC"; Nic reads ET. Dates pass through.
    function fmtClockET(v) {
      if (!v) return v;
      var s = String(v);
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      var d = null, m = s.match(/^(\d{1,2}):(\d{2})\s*UTC$/i);
      if (m) { d = new Date(); d.setUTCHours(parseInt(m[1], 10), parseInt(m[2], 10), 0, 0); }
      else { var t = Date.parse(s); if (!isNaN(t)) d = new Date(t); }
      if (!d) return s;
      try { return new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }).format(d) + ' ET'; }
      catch (e) { return s; }
    }

    // Plain-English regime labels (internal values stay RISK_ON/RISK_OFF/NEUTRAL)
    var REGIME_LABELS = {
      'RISK_ON': '🟢 Conditions favor buying',
      'RISK_OFF': '🔴 Conditions favor caution',
      'NEUTRAL': '🟡 Mixed conditions'
    };
    function regimeLabel(r) { return REGIME_LABELS[r] || r || '—'; }

    function badge(cls, name) {
      if ((cls || '').toLowerCase() === 'crypto') return '<span class="asset-badge badge-crypto">🪙 Crypto</span>';
      var nm = (name || '').toUpperCase();
      if (nm.indexOf('ETF') > -1 || nm.indexOf('SPDR') > -1) return '<span class="asset-badge badge-etf">📊 ETF</span>';
      return '<span class="asset-badge badge-stock">📈 Stock</span>';
    }

    function tradableLine(p) {
      var t = p.tradable || [];
      if (!t.length) return '<p><span class="trade-badge trade-none">⚠️ Not on your exchanges (Coinbase / Crypto.com)</span></p>';
      var labels = t.map(function (x) { return x === 'coinbase' ? 'Coinbase' : 'Crypto.com'; });
      return '<p><span class="trade-badge trade-yes">✅ Tradable on ' + labels.join(' + ') + '</span></p>';
    }

    function renderSwing(p) {
      var t = p.thesis || {};
      var bull = (t.bull_case || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
      var bear = (t.bear_case || []).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
      var dir = (t.direction || side).toUpperCase();
      var arrow = dir === 'LONG' ? '▲' : '▼';
      var featNames = ['Trend', 'Momentum', 'Volatility', 'Mean-reversion', 'Risk', 'MACD proxy', 'MA alignment',
        'Donchian', 'RSI', 'ROC', 'Stochastic', 'Bollinger %B', 'ATR proxy', 'Vol regime', 'Z-score',
        'Extreme fade', 'VaR proxy', 'Sentiment bias', 'Regime tilt', 'Geo edge', 'Volume', 'Acceleration'];
      var feats = (p.features || []).map(function (f, i) {
        return '<tr><td>' + (featNames[i] || ('F' + (i + 1))) + '</td><td>' + (f >= 0 ? '📈' : '📉') + ' ' + Number(f).toFixed(2) + '</td></tr>';
      }).join('');
      var mkt = marketLabel(marketOf(p));
      return '<div class="card"><h2>' + arrow + ' ' + esc(p.asset) + ' <span class="asset-name">' + esc(p.name || '') + '</span>' + (mkt ? ' <span class="live-stamp">· ' + mkt + '</span>' : '') + '</h2>' +
        '<p>' + badge(p.class, p.name) + '</p>' + tradableLine(p) +
        '<h3>The Trade</h3>' +
        '<p><strong>Direction:</strong> ' + dir + ' &nbsp; <strong>Confidence:</strong> ' + p.confidence + '%</p>' +
        '<p><strong>Entry:</strong> ' + esc(t.entry_date || 'today') + ' @ $' + Number(p.price).toLocaleString() + '</p>' +
        '<p><strong>Target:</strong> ' + esc(t.projected_exit || '—') + ' @ $' + (t.take_profit !== undefined ? Number(t.take_profit).toLocaleString() : '—') + ' (+' + (t.expected_return_pct || 0) + '%)</p>' +
        '<p><strong>Stop loss:</strong> $' + (t.stop_loss !== undefined ? Number(t.stop_loss).toLocaleString() : '—') + ' (−' + (t.max_loss_pct || 0) + '%)</p>' +
        '<p><strong>Risk/reward:</strong> ' + (t.risk_reward || '—') + ' &nbsp; <strong>Horizon:</strong> ' + esc(t.time_horizon || '—') + '</p>' +
        '<p><strong>Kelly position size:</strong> ' + (p.position_pct !== undefined ? p.position_pct : 0) + '%</p>' +
        '<h3>Why — Bull Case</h3><ul class="thesis-list">' + bull + '</ul>' +
        '<h3>Why Not — Bear Case</h3><ul class="thesis-list">' + bear + '</ul>' +
        '<h3>How the Model Got Here</h3>' +
        '<p><strong>Ensemble score:</strong> ' + (p.score !== undefined ? p.score : '—') +
        ' &nbsp; <strong>Geometric edge:</strong> ' + (p.geo_edge !== undefined ? p.geo_edge : '—') +
        ' &nbsp; <strong>Regime:</strong> ' + esc(regimeLabel(p.regime)) + '</p>' +
        '<table class="feat-table"><tr><th>Model signal</th><th>Value</th></tr>' + feats + '</table>' +
        '<p class="live-stamp">Positive values push bullish, negative push bearish. Scores combine trend, momentum, volatility, mean-reversion, and risk models with geometric pattern matching.</p>' +
        (p.info_url ? '<p><a class="asset-link" href="' + p.info_url + '" target="_blank" rel="noopener">Research ' + esc(p.asset) + ' externally ↗</a></p>' : '') +
        (p.edgar_url ? '<div id="edgar-deepdive"><p class="live-stamp">Loading SEC filings…</p></div>' : '') +
        '<p class="live-stamp">' + esc(p.reason || '') + '</p></div>';
    }

    function renderIntraday(s) {
      var t = s.thesis || {};
      var arrow = s.direction === 'LONG' ? '▲' : '▼';
      return '<div class="card"><h2>' + arrow + ' ' + esc(s.asset) + ' <span class="asset-name">' + esc(s.name || '') + '</span> <span class="live-stamp">· Crypto</span></h2>' +
        '<p><span class="asset-badge badge-crypto">🪙 Crypto</span> <span class="live-stamp">Intraday signal</span></p>' + tradableLine(s) +
        '<h3>The Trade</h3>' +
        '<p><strong>Direction:</strong> ' + s.direction + ' &nbsp; <strong>Confidence:</strong> ' + s.confidence + '%</p>' +
        '<p><strong>In:</strong> ' + esc(t.entry_time ? fmtClockET(t.entry_time) : '—') + ' @ $' + t.entry + '</p>' +
        '<p><strong>Out by:</strong> ' + esc(t.exit_by ? fmtClockET(t.exit_by) : '—') + '</p>' +
        '<p><strong>Stop:</strong> $' + t.stop_loss + ' &nbsp; <strong>Target:</strong> $' + t.take_profit + '</p>' +
        '<p><strong>1h change:</strong> ' + t.chg_1h + '% &nbsp; <strong>RSI:</strong> ' + t.rsi + '</p>' +
        '<p><strong>Horizon:</strong> 1–4 hours</p>' +
        (s.info_url ? '<p><a class="asset-link" href="' + s.info_url + '" target="_blank" rel="noopener">Research ' + esc(s.asset) + ' externally ↗</a></p>' : '') + '</div>';
    }

    function loadEdgarFilings(cik, asset, edgarUrl) {
      var el = document.getElementById('edgar-deepdive');
      if (!el) return;
      var cikPadded = String(cik).padStart(10, '0');
      fetch('https://data.sec.gov/submissions/CIK' + cikPadded + '.json')
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (d) {
          var recent = d.filings.recent;
          var KEY_FORMS = ['10-K', '10-Q', '8-K', '4'];
          var rows = [];
          for (var i = 0; i < recent.form.length && rows.length < 8; i++) {
            var form = recent.form[i];
            if (KEY_FORMS.indexOf(form) === -1) continue;
            var date = recent.filingDate[i];
            var acc = (recent.accessionNumber[i] || '').replace(/-/g, '');
            var doc = recent.primaryDocument[i];
            var docUrl = 'https://www.sec.gov/Archives/edgar/data/' + cik + '/' + acc + '/' + doc;
            var label = form === '4' ? 'Form 4 (insider trade)' : 'Form ' + form;
            rows.push('<tr><td><a class="asset-link" href="' + docUrl + '" target="_blank" rel="noopener">' + label + '</a></td><td>' + date + '</td></tr>');
          }
          el.innerHTML = '<h3>📄 SEC Filings Deep Dive</h3>' +
            '<p class="live-stamp">Latest key filings for ' + esc(asset) + ' from SEC EDGAR — the primary source. 10-K = annual report, 10-Q = quarterly, 8-K = major events, Form 4 = insider trades.</p>' +
            (rows.length ? '<table class="feat-table"><tr><th>Filing</th><th>Date</th></tr>' + rows.join('') + '</table>' : '<p class="live-stamp">No key filings found.</p>') +
            (edgarUrl ? '<p><a class="asset-link" href="' + edgarUrl + '" target="_blank" rel="noopener">All filings on EDGAR ↗</a></p>' : '');
        })
        .catch(function () {
          el.innerHTML = '<h3>📄 SEC Filings Deep Dive</h3>' +
            '<p class="live-stamp">Could not load filings live — <a class="asset-link" href="' + (edgarUrl || '#') + '" target="_blank" rel="noopener">open EDGAR directly ↗</a></p>';
        });
    }

    // One symbol, two assets (CVX = Convex Finance in crypto, Chevron in
    // stocks): list every match with its market, name, and price, each
    // linking to the same page with &market= so the choice is explicit.
    function disambigList(matches, type) {
      var items = matches.map(function (m) {
        var p = m.p, mkt = marketOf(p), lbl = marketLabel(mkt) || 'Unknown market';
        var dir = (p.direction || (p.thesis && p.thesis.direction) || m.side || '').toUpperCase();
        var link = 'pick.html?asset=' + encodeURIComponent(p.asset) + '&type=' + type +
          (type === 'swing' ? '&side=' + m.side : '') + (mkt ? '&market=' + mkt : '');
        var price = p.price !== undefined ? Number(p.price).toLocaleString()
          : (p.thesis && p.thesis.entry !== undefined ? Number(p.thesis.entry).toLocaleString() : '—');
        return '<li><strong>' + esc(p.asset) + ' — ' + esc(p.name || '') + '</strong> (' + lbl + ')' +
          (dir ? ' · ' + dir : '') + ' · $' + price +
          (p.news_flag ? ' · 🚫 flagged' : '') +
          ' — <a class="asset-link" href="' + link + '">View this one →</a></li>';
      }).join('');
      return '<ul class="thesis-list">' + items + '</ul>';
    }

    function renderDisambiguation(matches, type) {
      return '<div class="card"><h3>Two assets share the symbol ' + esc(asset) + '</h3>' +
        '<p>That symbol means two different things — pick which one you meant. Crypto is the token, Stock is the listed company.</p>' +
        disambigList(matches, type) +
        '<p><a href="picks.html" class="asset-link">← Back to Picks</a></p></div>';
    }

    function load() {
      var url = type === 'intraday' ? 'data/intraday.json' : 'data/latest.json';
      fetch(url, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (d) {
          // Unified freshness stamp from whichever engine file this page
          // loaded (intraday detail → intraday.json, swing → latest.json)
          if (window.nxStampInto) window.nxStampInto(document.getElementById('data-stamp'), d);
          var el = document.getElementById('pick-detail');
          // Collect every pick with this symbol, tagged with its market
          // and side. CVX is two assets (crypto Convex Finance, stock
          // Chevron) — never silently show whichever the engine listed first.
          var tagged = [];
          if (type === 'intraday') {
            (d.longs || []).concat(d.shorts || []).forEach(function (s) {
              tagged.push({ p: s, side: (s.direction || '').toUpperCase() === 'SHORT' ? 'short' : 'long', intra: true });
            });
          } else {
            (d.longs || []).forEach(function (p) { tagged.push({ p: p, side: 'long', intra: false }); });
            (d.shorts || []).forEach(function (p) { tagged.push({ p: p, side: 'short', intra: false }); });
          }
          var matches = tagged.filter(function (m) { return (m.p.asset || '').toUpperCase() === asset; });
          var unfiltered = matches.slice();
          if (marketParam) matches = matches.filter(function (m) { return marketOf(m.p) === marketParam; });
          if (!matches.length) {
            if (marketParam && unfiltered.length) {
              // The symbol exists, just not in the market asked for —
              // point at the one(s) that do exist instead of a dead end.
              el.innerHTML = '<div class="card"><h3>No ' + esc(asset) + ' in the ' + esc(marketLabel(marketParam)) + ' market</h3>' +
                '<p class="live-stamp">' + esc(asset) + ' is in the current ' + esc(type) + ' picks, but not as ' + esc(marketLabel(marketParam)) + '. Try the other market:</p>' +
                disambigList(unfiltered, type) +
                '<p><a href="picks.html" class="asset-link">← Back to Picks</a></p></div>';
              return;
            }
            el.innerHTML = '<div class="card"><h3>Pick not found</h3><p class="live-stamp">' + esc(asset) + ' is not in the current ' + esc(type) + ' picks. It may have rotated out — check the Picks page for the latest.</p></div>';
            return;
          }
          if (!marketParam && matches.length > 1) {
            var markets = {};
            matches.forEach(function (m) { markets[marketOf(m.p)] = 1; });
            if (Object.keys(markets).length > 1) {
              // Same symbol in more than one market — show both, pick neither.
              el.innerHTML = renderDisambiguation(matches, type);
              document.title = asset + ' — Which one? — OmniSight';
              return;
            }
          }
          var found = matches[0].p, isIntra = matches[0].intra;
          if (!isIntra) side = matches[0].side; // side from the actual match, not the URL guess
          // News-flagged picks are scrubbed from the Picks page entirely
          // (Nic, 2026-10-22 — the ZEC lesson: a bad headline outranks a
          // model score). A hand-typed URL must not bypass that scrub, so a
          // flagged pick renders as a warning, never as a trade — no entry,
          // no target, no stop.
          var foundMkt = marketLabel(marketOf(found));
          if (found.news_flag) {
            el.innerHTML = '<div class="card"><h2>🚫 ' + esc(found.asset) + (found.name ? ' <span class="asset-name">' + esc(found.name) + '</span>' : '') + (foundMkt ? ' <span class="live-stamp">· ' + foundMkt + '</span>' : '') + ' — Flagged, Not a Trade</h2>' +
              '<p><strong>News risk:</strong> ' + esc(found.news_flag) + '</p>' +
              '<p class="live-stamp">The engine flagged this pick on a headline and excluded it from the Picks page. A headline outranks a model score — there is no trade here until the flag clears on a fresh run.</p>' +
              '<p><a href="picks.html" class="asset-link">← Back to Picks</a></p></div>';
            document.title = found.asset + (foundMkt ? ' (' + foundMkt + ')' : '') + ' — Flagged — OmniSight';
            return;
          }
          el.innerHTML = isIntra ? renderIntraday(found) : renderSwing(found);
          document.title = found.asset + (foundMkt ? ' (' + foundMkt + ')' : '') + ' — OmniSight Pick Detail';
          // EDGAR deep dive: fetch recent SEC filings for equity picks
          if (!isIntra && found.cik) {
            loadEdgarFilings(found.cik, found.asset, found.edgar_url);
          }
        })
        .catch(function () {
          document.getElementById('pick-detail').innerHTML = '<p class="live-stamp">Could not load pick data.</p>';
        });
    }
    load();
  })();
  </script>
  <script src="ticker-tape.js"></script>
</body>
</html>
