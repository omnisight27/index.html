<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — OmniSight</title>
<link rel="stylesheet" href="styles.css">
<style>
  .login-card { max-width: 420px; margin: 48px auto; }
  .login-card h2 { margin-top: 0; }
  .login-card input[type="email"] {
    width: 100%; box-sizing: border-box; padding: 12px; margin: 0 0 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 16px;
  }
  .login-card .btn { width: 100%; margin: 0 0 10px; }
  #login-status { min-height: 20px; font-size: 14px; color: var(--accent); }
</style>
</head>
<body>
<header class="nav">
  <div class="nav-brand">OmniSight</div>
  <button class="nav-toggle" aria-label="Menu">☰</button>
  <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="picks.html">Picks</a>
      <a href="alerts.html">Alerts</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="govgistics.html">Contract Intel</a>
      <a href="grants.html">Grants</a>
      <a href="economy.html">Economy</a>
      <a href="land.html">Land</a>
      <a href="hub.html">Hub</a>
      <a href="profile.html">Profile</a>
    </nav>
</header>

<main class="container">
  <div class="card login-card">
    <h2>Log in to OmniSight</h2>
    <p class="hint">We email you a sign-in link — no password to remember.</p>
    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    <button class="btn primary" id="login-magic" type="button">Email me a sign-in link</button>
    <button class="btn" id="login-google" type="button">Continue with Google</button>
    <div id="login-status" role="status"></div>
  </div>
</main>

<script src="nav.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }

  // Where to finish signing in. The magic-link / Google redirect lands on the
  // target page itself (already wired for auth), so no new redirect URLs needed.
  var next = qs('next') || 'index.html';
  // Keep it on this site.
  if (/^(https?:)?\/\//.test(next) || next.indexOf('..') !== -1) next = 'index.html';
  var redirectTo = window.location.origin +
    window.location.pathname.replace(/[^\/]*$/, '') + next;

  var statusEl = document.getElementById('login-status');
  function status(msg) { statusEl.textContent = msg; }

  function done() {
    window.location.href = next;
  }

  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  s.onload = function () {
    var client;
    try {
      client = window.supabase.createClient(
        window.OMNISIGHT_CONFIG.SUPABASE_URL,
        window.OMNISIGHT_CONFIG.SUPABASE_ANON_KEY
      );
    } catch (e) {
      status('Sign-in could not start. Check your connection and reload.');
      return;
    }
    // Already signed in? Go straight to the destination.
    client.auth.getSession().then(function (r) {
      if (r.data && r.data.session) { done(); }
    });
    client.auth.onAuthStateChange(function (_event, session) {
      if (session) { done(); }
    });

    document.getElementById('login-magic').addEventListener('click', function () {
      var email = document.getElementById('login-email').value.trim();
      if (!email) { status('Type your email first.'); return; }
      status('Sending…');
      client.auth.signInWithOtp({
        email: email,
        options: { emailRedirectTo: redirectTo }
      }).then(function (r) {
        status(r.error ? ('Error: ' + r.error.message)
                       : 'Check your email — tap the link to finish signing in.');
      }).catch(function () {
        status('Could not reach the sign-in service. Check your connection and try again.');
      });
    });

    document.getElementById('login-google').addEventListener('click', function () {
      client.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectTo }
      });
    });
  };
  s.onerror = function () {
    status('Sign-in could not load. Check your connection and reload.');
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
